name: CI/CD Pipeline

# Public repo → GitHub-hosted runners (same convention as solvelab/service-checker).
# Self-hosted k8s-runner is reserved for private repos: on a public repo a fork PR
# could execute arbitrary code on the runner machine.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Job 1: Validate ──────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # fetch-depth: 0 — the spec-rite gate diffs this branch against its base. The default
        # depth of 1 leaves no base revision, and a gate that cannot measure must not approve.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wrappers in sync with skills/
        run: |
          bash generate.sh
          if ! git diff --exit-code --quiet; then
            echo "::error::Generated wrappers are out of sync. Run ./generate.sh and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Version coherence (VERSION == plugin.json == marketplace.json)
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if ! grep -q "\"version\": \"$VERSION\"" "$f"; then
              echo "::error::$f version does not match VERSION ($VERSION)."
              exit 1
            fi
          done
          echo "Version $VERSION coherent across manifests."

      - name: Skill frontmatter checks
        run: |
          CATEGORIES="backend testing fivem game devops docs git process nui frontend tooling"
          fail=0
          for f in skills/*/SKILL.md; do
            dir="$(basename "$(dirname "$f")")"
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::Missing frontmatter"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::Missing name"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::Missing description"; fail=1; }
            grep -q '^description: >-' "$f" || { echo "::error file=$f::description must be a folded block scalar ('description: >-')"; fail=1; }
            name="$(grep -m1 '^name:' "$f" | sed 's/^name: *//')"
            [ "$name" = "$dir" ] || { echo "::error file=$f::name '$name' != directory '$dir'"; fail=1; }
            grep -qE '^  version: [0-9]+\.[0-9]+\.[0-9]+' "$f" || { echo "::error file=$f::Missing metadata.version (semver)"; fail=1; }
            grep -qx '  author: solvelab' "$f" || { echo "::error file=$f::metadata.author must be exactly 'solvelab'"; fail=1; }
            grep -qx 'license: MIT' "$f" || { echo "::error file=$f::license must be exactly 'MIT'"; fail=1; }
            grep -q '^compatibility:' "$f" || { echo "::error file=$f::Missing compatibility"; fail=1; }
            cat="$(grep -m1 '^  category:' "$f" | sed 's/^  category: *//')"
            if [ -z "$cat" ]; then
              echo "::error file=$f::Missing metadata.category"; fail=1
            else
              echo "$CATEGORIES" | tr ' ' '\n' | grep -qx "$cat" || { echo "::error file=$f::category '$cat' not in: $CATEGORIES"; fail=1; }
            fi
          done
          exit $fail

      - name: Skill content checks (paths, cross-refs, code blocks, pins)
        run: |
          python3 -m pip install --quiet pyyaml
          sudo apt-get install -y -qq lua5.4 >/dev/null 2>&1 || true
          python3 scripts/validate-skills.py

      - name: Skill validator self-test (the gate is itself gated)
        run: python3 scripts/selftest-validate-skills.py

      - name: Identifier-locale detector self-test (the shipped script is itself gated)
        run: python3 skills/code-locale/references/check-identifier-locale.py --selftest

      - name: Locale write-gate hook self-test (the shipped hook is itself gated)
        run: python3 claude/global/hooks/locale-rite.py --selftest

      - name: Backlog rite hook self-test (the shipped hook is itself gated)
        run: python3 claude/global/hooks/backlog-rite.py --selftest

      - name: Grounding rite hook self-test (the shipped hook is itself gated)
        run: python3 claude/global/hooks/verify-rite.py --selftest

      - name: Secret scan (working tree)
        run: python3 scripts/scan-secrets.py

      - name: Repo hygiene (compiled artifacts, published counts)
        run: python3 scripts/validate-repo-hygiene.py

      - name: Repo hygiene self-test (the gate is itself gated)
        run: python3 scripts/validate-repo-hygiene.py --selftest

      - name: OpenSpec rite gate (skills-rite schema)
        # The spec-rite gate reads the waiver line from the event payload the runner already wrote
        # (GITHUB_EVENT_PATH). Handing the pull request body over through this step's `env:` block
        # printed the whole body into the build log, because Actions echoes that block — measured
        # on run 32648727841. The body is still untrusted input: the gate matches it as text and
        # never executes or interpolates it.
        run: bash scripts/validate-rite.sh

      - name: Rite evidence self-test (the gate is itself gated)
        run: python3 scripts/validate-rite-evidence.py --selftest

      - name: Spec-rite self-test (the gate is itself gated)
        run: python3 scripts/validate-spec-rite.py --selftest

      - name: Claude plugin validation (vendor validator, blocking)
        # Was `continue-on-error: true` AND `|| true` — disabled twice over, so it never failed a
        # build. Measured on 2026-08-26 with claude 2.1.246: `plugin validate . --strict` passes on
        # this repository, and against a fixture holding a SKILL.md with no description it exits
        # non-zero with "Validation failed (--strict treats warnings as errors)". It checks the
        # manifest and the skills' frontmatter; name-vs-directory is scripts/validate-skills.py's
        # job, so the two are complementary and both stay.
        #
        # The version is pinned on purpose: a blocking gate on @latest fails this repository's builds
        # on someone else's release schedule. Bump it deliberately, after running it locally.
        run: npx -y @anthropic-ai/claude-code@2.1.246 plugin validate . --strict

  # ─── Job 2: Semantic Release ─────────────────────────────────
  release:
    name: Semantic Release
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check_release.outputs.new_release }}
      version: ${{ steps.check_release.outputs.version }}
    steps:
      - name: Checkout
        # ref: master — NOT the triggering commit. On a push event checkout defaults to github.sha,
        # so a run queued behind a later merge works on a HEAD that is already behind the remote,
        # and semantic-release then refuses to publish: measured on run 32959050372 (commit 4875a6c,
        # PR #102, a feat), which exited green having published nothing.
        # Checking out the tip is safe because master runs are serialized by the concurrency group
        # above (cancel-in-progress: false): this job never runs while another master run is in
        # flight, so it publishes what is due for every commit up to the tip, and the next run finds
        # nothing left to release.
        # The commit released may therefore be newer than the one Validate examined in THIS run.
        # Each of those commits passed Validate on its own pull request; master is protected and
        # takes no direct push other than the [skip ci] release commit.
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "prev_tag=${PREV:-none}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-semantic-release-${{ hashFiles('.releaserc.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-semantic-release-

      - name: Install semantic-release
        # conventional-changelog-conventionalcommits is pinned to @8: v9 is silently
        # incompatible with release-notes-generator and produces EMPTY release notes.
        run: npm install -g semantic-release@25 @semantic-release/git@10 @semantic-release/changelog@6 @semantic-release/exec@7 conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The output is teed to a file so the next step can inspect it. pipefail is set explicitly:
        # the default shell for a `run:` block on Linux is `bash -e {0}`, without pipefail, and
        # without it a semantic-release failure would be masked by tee's exit code.
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log

      - name: Fail if the release was skipped because the checkout was behind
        # A tripwire, not a routine path: with `ref: master` above this condition should no longer
        # occur. It stays because the failure it covers already happened once in silence, and
        # because the checkout fix rests on a premise — the concurrency serialization — that a
        # future edit could remove without noticing.
        #
        # Why the log and not the exit code: semantic-release@25.0.9 handles this case in
        # index.js:87-96 — verifyAuth runs `git push --dry-run` (git.js:209), it fails
        # non-fast-forward, isBranchUpToDate (git.js:296) confirms the branch is behind, and the
        # function logs the line below and returns false. That false reaches cli.js:55, which
        # returns 0. The process exits SUCCESS having published nothing, which is byte-for-byte the
        # same outcome as a legitimate docs-only push. Only the log tells them apart.
        #
        # WHAT THIS DOES NOT COVER: it matches one string emitted by the pinned semantic-release
        # version installed above. An upstream rewording silences it with no signal, and it says
        # nothing about any other reason a release might be skipped. A green run here is not proof
        # that a release was due and published — it is proof that this one refusal did not happen.
        run: |
          if grep -qF 'is behind the remote one' semantic-release.log; then
            echo "::error::semantic-release refused to publish: the checked-out branch is behind the remote one. The release job must run against the tip of master (see the 'ref: master' comment on this job's checkout step). Nothing was published by this run."
            exit 1
          fi

      - name: Check if new release was created
        id: check_release
        run: |
          git fetch --tags --force 2>/dev/null || true
          CURRENT=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          PREV="${{ steps.prev_tag.outputs.prev_tag }}"

          if [ "$CURRENT" != "$PREV" ] && [ -n "$CURRENT" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
            echo "New release detected: $CURRENT (was: $PREV)"
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
            echo "No new release (current: $CURRENT)"
          fi
