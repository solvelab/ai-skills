<!doctype html><meta charset="utf-8"><title>flag — simulation of the svg-animation skill</title>
<style>
  html,body{margin:0;background:#cddff0}
  #c{width:1100px;height:520px;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<div id="c"><canvas id="k" width="1100" height="520"></canvas></div>
<script>
// SIMULATION of skills/svg-animation, walked through its real path on a request it never saw:
// "uma bandeira tremulando no vento".
//
// 1 ROUTE      driven-oscillator (motion). No "textiles" schema exists and none is needed.
// 2 SCHEMA     the nine questions, answered:
//   Q1 frequency   Strouhal f = St*U/L, St ~ 0.2. L=1.5 m, U=8 m/s -> 1.07 Hz.   [measured law]
//   Q2 damping     aerodynamic and dominant; cloth stores almost no energy.       [derived]
//   Q3 AMPLITUDE   grows monotonically from the hoist to the fly, and is ZERO at the pole by
//                  constraint. Uniform amplitude is the classic SVG-flag defect, and the schema
//                  asking for amplitude-per-rate is what prevented it here.        [derived]
//                  check: 2*pi*f*A at the fly = 2.35 m/s = 29% of an 8 m/s wind — plausible.
//   Q5 STOCHASTIC DRIVER?  **NO — and this is the point.** A flag is not a structure shaken by
//                  turbulence like a tree. It is FLUTTER: a self-excited instability with a
//                  well-defined frequency and a wave TRAVELLING downstream from the pole.
//                  Turbulence only modulates it. The tree answered YES to the same question and
//                  got a different model. Same schema, different answer, different model.
//   Q4 forcing spectrum   n/a to the flutter itself, which is self-excited. It applies only to
//                  the slow WIND modulation, which uses five low components below 0.4 Hz.
//   Q6 coherence   n/a — the motion IS a coherent wave by construction, not a driven field.
//   Q7 mean vs fluctuation  the flag streams downwind and undulates about that.
//   Q8 reconfiguration  yes: a flag streams and its projected area collapses, which is why the
//                  cloth does not tear. Modelled as the 6% shortening of the span toward the fly.
//   Q9 anchor      Beaufort again: 3 "light flag extends", 5 "small flags flutter".
// 3 VIEWPOINT GATE  a flag seen edge-on shows nothing. Fixed: broadside, wind left to right.
// 4 PROVENANCE      St = 0.2 [measured law]; wave count 1.4 along the span [assumed];
//                   amplitude exponent 1.8 [assumed]. Both assumptions are stated here.
const ctx = document.getElementById('k').getContext('2d')
const W = 1100, H = 520
const PX_PER_M = 150                    // the flag is 1.5 m on the hoist -> 225 px

const U = 8, ST = 0.2, L_M = 1.5
const FREQ = ST * U / L_M               // Hz, from the Strouhal number
const SPAN = L_M * PX_PER_M * 1.6       // fly length, 1.6x the hoist
const HOIST = L_M * PX_PER_M
const WAVES = 1.4                       // [assumed] waves carried along the span
const AMP_MAX = 0.35 * PX_PER_M         // [assumed] fly-end amplitude, 0.35 m
const AMP_P = 1.8                       // [assumed] how fast amplitude grows toward the fly

const X0 = 210, Y0 = 130
// Slow stochastic modulation: the flutter is deterministic, the WIND is not.
const mod = []
for (let i = 0; i < 5; i++) mod.push({ w: 2 * Math.PI * (0.05 + i * 0.07), a: 0.16 / (i + 1), ph: i * 2.1 })

const NS = 44, NT = 18
function frame(now) {
  const t = now / 1000
  let g = 1
  for (const m of mod) g += m.a * Math.sin(m.w * t + m.ph)
  const f = FREQ * g                    // gust raises the flapping rate; Strouhal ties them
  ctx.clearRect(0, 0, W, H)

  // Pole
  ctx.fillStyle = '#6b6560'
  ctx.fillRect(X0 - 7, Y0 - 40, 9, HOIST + 130)
  ctx.fillStyle = '#8f8983'
  ctx.beginPath(); ctx.arc(X0 - 2.5, Y0 - 44, 8, 0, 6.283); ctx.fill()

  for (let j = 0; j < NT; j++) {
    const v = j / (NT - 1)
    const yTop = Y0 + v * HOIST
    for (let i = 0; i < NS - 1; i++) {
      const s0 = i / (NS - 1), s1 = (i + 1) / (NS - 1)
      const q = (s, vv) => {
        // The travelling wave. Phase runs along the SPAN, so the crest moves out to the fly —
        // a standing oscillation would flap the whole cloth at once, which is not what a flag does.
        const th = 2 * Math.PI * (WAVES * s - f * t) + vv * 0.55
        const amp = AMP_MAX * Math.pow(s, AMP_P) * g
        return [X0 + s * SPAN * (1 - 0.06 * Math.pow(s, 2)), yTop + amp * Math.sin(th), amp * Math.cos(th)]
      }
      const [xa, ya, ca] = q(s0, v)
      const [xb, yb] = q(s1, v)
      // Shading from the local slope: cloth turning away from the light goes dark. This is what
      // makes the travelling wave legible at all — a flat fill hides the whole motion.
      const lit = 0.5 + 0.5 * (ca / (AMP_MAX + 1e-6))
      const band = v < 1 / 3 ? [0, 118, 82] : v < 2 / 3 ? [242, 240, 236] : [190, 46, 60]
      const k = 0.55 + 0.45 * lit
      ctx.fillStyle = `rgb(${band[0] * k | 0},${band[1] * k | 0},${band[2] * k | 0})`
      ctx.fillRect(xa, ya, xb - xa + 1.2, HOIST / (NT - 1) + 1.2)
    }
  }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
