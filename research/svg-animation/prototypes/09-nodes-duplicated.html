<!doctype html>
<meta charset="utf-8">
<title>09 — 1500 duplicated path nodes</title>
<style>
  html, body { margin: 0; background: #05070f; color: #cfe1ff;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .caption { padding: 8px 12px; }
  #stage { position: relative; width: 100vw; height: calc(100vh - 40px); overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%;
    animation: drift 20s linear infinite; will-change: transform; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-200px); } }
</style>
<div class="caption">09 — <b>1500 duplicated &lt;path&gt; nodes</b>. Each star is its own full path.</div>
<div id="stage"></div>
<script>
  // Pair to 10. Same 1500 stars, same drift, same visual result. Here every star is a complete
  // <path> with its own geometry data. 10 draws the identical scene from one <defs> symbol and
  // 1500 <use> references. The animation is deliberately the cheap kind measured in 08 (one <svg>
  // element moving) so that the per-frame channel is held constant and the difference that shows
  // up is the cost of the nodes themselves, not the cost of animating them.
  const SVGNS = 'http://www.w3.org/2000/svg'
  const COUNT = 1500
  const STAR = 'M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8Z'

  const svg = document.createElementNS(SVGNS, 'svg')
  svg.setAttribute('viewBox', '0 0 1400 640')
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice')
  for (let i = 0; i < COUNT; i++) {
    const p = document.createElementNS(SVGNS, 'path')
    p.setAttribute('d', STAR)
    p.setAttribute('transform',
      `translate(${(i * 137) % 1400} ${(i * 89) % 640}) scale(${0.3 + (i % 5) * 0.15})`)
    p.setAttribute('fill', '#dce8ff')
    p.setAttribute('opacity', 0.3 + (i % 5) * 0.12)
    svg.appendChild(p)
  }
  document.getElementById('stage').appendChild(svg)
</script>
