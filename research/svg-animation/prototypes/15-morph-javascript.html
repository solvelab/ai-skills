<!doctype html>
<meta charset="utf-8">
<title>15 — path morphing by rewriting d from JS</title>
<style>
  html, body { margin: 0; background: #0b1020; color: #cfe1ff;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .caption { padding: 8px 12px; }
  svg { display: block; width: 100vw; height: calc(100vh - 40px); }
</style>
<div class="caption">15 — <b>morph by rewriting <code>d</code> from JS</b>. 24 shapes interpolating between two command-matched paths.</div>
<svg id="stage" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice"></svg>
<script>
  // Pair to 16, which asks CSS to do the same interpolation declaratively.
  //
  // The precondition both share, and the one that decides whether morphing works at all: the two
  // paths must have the SAME command sequence. Interpolation is pairwise over numbers, so a path
  // with 8 curves cannot become one with 6 without something first resampling it. Both blobs below
  // are 8 cubic segments by construction, which is why no library is needed here.
  const SVGNS = 'http://www.w3.org/2000/svg'
  const COUNT = 24
  const SEGMENTS = 8
  const stage = document.getElementById('stage')

  // Build a closed blob as SEGMENTS cubic curves around a circle, radius modulated per vertex.
  function blob(cx, cy, radius, wobble, phase) {
    const pts = []
    for (let i = 0; i < SEGMENTS; i++) {
      const a = (i / SEGMENTS) * Math.PI * 2
      const r = radius * (1 + Math.sin(a * 3 + phase) * wobble)
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r])
    }
    return pts
  }

  // Catmull-Rom through the points, emitted as cubics: same command count every time.
  function toPath(pts) {
    const n = pts.length
    let d = `M${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n]
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6]
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6]
      d += `C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`
    }
    return d + 'Z'
  }

  const shapes = []
  for (let i = 0; i < COUNT; i++) {
    const p = document.createElementNS(SVGNS, 'path')
    const cx = 100 + (i % 8) * 143, cy = 120 + Math.floor(i / 8) * 200
    p.setAttribute('fill', 'none')
    p.setAttribute('stroke', `hsl(${(i * 15 + 190) % 360} 80% 68%)`)
    p.setAttribute('stroke-width', 2)
    stage.appendChild(p)
    shapes.push({ node: p, cx, cy, phase: (i / COUNT) * Math.PI * 2 })
  }

  function frame(now) {
    const t = now / 1000
    for (const s of shapes) {
      // A single scalar drives the interpolation; both endpoints are generated with the same
      // command count, so a plain lerp over the vertices is a valid morph.
      const k = (Math.sin(t + s.phase) + 1) / 2
      const a = blob(s.cx, s.cy, 52, 0.05, 0)
      const b = blob(s.cx, s.cy, 44, 0.42, 2.1)
      const mixed = a.map((p, i) => [p[0] + (b[i][0] - p[0]) * k, p[1] + (b[i][1] - p[1]) * k])
      s.node.setAttribute('d', toPath(mixed))
    }
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
</script>
