<!doctype html>
<meta charset="utf-8">
<title>18 — waves by translating a seamless tile</title>
<style>
  html, body { margin: 0; background: #071427; color: #cfe1ff;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .caption { padding: 8px 12px; }
  #stage { position: relative; width: 100vw; height: calc(100vh - 40px); overflow: hidden; }
  .waveLayer { position: absolute; inset: 0; width: 100%; height: 100%;
    will-change: transform; animation: roll linear infinite; }
  /* The tile is 2x the viewBox and its right half repeats its left half exactly, so translating
     by 50% returns to an identical picture: the loop has no seam to see. */
  @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
<div class="caption">18 — <b>waves as a translated seamless tile</b>. Same 4 layers; geometry written once.</div>
<div id="stage"></div>
<script>
  // Pair to 17. The path is generated once per layer at twice the width, using only frequencies
  // that complete a whole number of cycles across that width — that integer constraint is what
  // makes the wrap seamless. Motion then comes from the free channel measured in 08.
  //
  // The trade, stated plainly: the surface repeats every cycle. Two layers rolling at rates that
  // are not simple multiples of each other hide it well, but a viewer who stares will eventually
  // see the period. 17 has no period and pays for it every frame.
  const SVGNS = 'http://www.w3.org/2000/svg'
  const LAYERS = 4
  const SAMPLES = 180
  const W = 2400          // twice the 1200 viewport width
  const stage = document.getElementById('stage')

  for (let d = 0; d < LAYERS; d++) {
    const svg = document.createElementNS(SVGNS, 'svg')
    svg.setAttribute('class', 'waveLayer')
    svg.setAttribute('viewBox', `0 0 ${W} 640`)
    svg.setAttribute('preserveAspectRatio', 'none')
    svg.style.width = '200%'
    svg.style.animationDuration = `${14 + d * 5}s`

    const base = 300 + d * 52
    const amp = 26 - d * 4
    const p = document.createElementNS(SVGNS, 'path')
    let path = `M0 640 L0 ${base}`
    for (let i = 0; i <= SAMPLES; i++) {
      const x = (i / SAMPLES) * W
      const u = (x / W) * Math.PI * 2
      // Integer harmonics only: 3, 7 and 13 cycles across the tile all close exactly at the wrap.
      const y = base
        + Math.sin(u * 3 + d) * amp
        + Math.sin(u * 7 - d * 0.6) * amp * 0.4
        + Math.sin(u * 13 + d * 1.3) * amp * 0.18
      path += ` L${x.toFixed(1)} ${y.toFixed(2)}`
    }
    path += ` L${W} 640 Z`
    p.setAttribute('d', path)
    p.setAttribute('fill', `hsl(205 70% ${16 + d * 7}%)`)
    p.setAttribute('opacity', 0.55 + d * 0.14)
    svg.appendChild(p)
    stage.appendChild(svg)
  }
</script>
