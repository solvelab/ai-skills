<!doctype html>
<meta charset="utf-8">
<title>12 — feTurbulence rasterised once, then moved</title>
<style>
  html, body { margin: 0; background: #0b1020; color: #cfe1ff;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .caption { padding: 8px 12px; }
  #stage { position: relative; width: 100vw; height: calc(100vh - 40px); overflow: hidden;
    background: #0b1020; }
  .cloudLayer { position: absolute; top: 0; left: 0; width: 200%; height: 100%;
    will-change: transform; }
  .near { animation: slide 40s linear infinite; opacity: 0.85; }
  .far  { animation: slide 90s linear infinite; opacity: 0.5; transform: scale(1.4); }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
<div class="caption">12 — <b>feTurbulence evaluated once</b>, then two copies drifted by transform. Same look, motion from movement rather than regeneration.</div>
<div id="stage">
  <svg class="cloudLayer far" viewBox="0 0 2400 640" preserveAspectRatio="none">
    <defs>
      <filter id="noiseFar" x="0" y="0" width="100%" height="100%">
        <!-- No <animate> here. The field is generated once; the illusion of movement comes from
             translating the finished raster, which is the channel 08 showed to be free of layout.
             The band is 2x wide and scrolls exactly 50% so the loop is seamless. -->
        <feTurbulence type="fractalNoise" baseFrequency="0.004 0.009" numOctaves="4" seed="7"
                      result="noise"/>
        <feColorMatrix in="noise" type="matrix"
          values="0 0 0 0 0.62
                  0 0 0 0 0.72
                  0 0 0 0 0.92
                  0 0 0 -1.1 1.02"/>
      </filter>
    </defs>
    <rect width="2400" height="640" filter="url(#noiseFar)"/>
  </svg>
  <svg class="cloudLayer near" viewBox="0 0 2400 640" preserveAspectRatio="none">
    <defs>
      <filter id="noiseNear" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="4" seed="19"
                      result="noise"/>
        <feColorMatrix in="noise" type="matrix"
          values="0 0 0 0 0.70
                  0 0 0 0 0.78
                  0 0 0 0 0.95
                  0 0 0 -1.3 1.12"/>
      </filter>
    </defs>
    <rect width="2400" height="640" filter="url(#noiseNear)"/>
  </svg>
</div>
