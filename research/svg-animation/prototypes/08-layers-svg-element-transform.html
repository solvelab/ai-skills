<!doctype html>
<meta charset="utf-8">
<title>08 — parallax by transforming sibling &lt;svg&gt; elements</title>
<style>
  html, body { margin: 0; background: #05070f; color: #cfe1ff;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .caption { padding: 8px 12px; }
  #stage { position: relative; width: 100vw; height: calc(100vh - 40px); overflow: hidden; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%;
    animation: drift 12s linear infinite; will-change: transform; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-300px); } }
</style>
<div class="caption">08 — <b>parallax via sibling &lt;svg&gt; layers</b>. Same 5 depths, same 600 stars.</div>
<div id="stage"></div>
<script>
  // Identical scene to 07 — same star positions, same drift rates, same total node count. The one
  // difference: each depth is its own <svg> element positioned by CSS, so the thing being animated
  // is an HTML-level box rather than an SVG child. If the layout cost measured in 01-06 is a
  // property of animating inside the SVG layout tree, this page pays it once per layer instead of
  // once per element, or not at all.
  const SVGNS = 'http://www.w3.org/2000/svg'
  const stage = document.getElementById('stage')
  const LAYERS = 5, PER_LAYER = 120

  for (let d = 0; d < LAYERS; d++) {
    const svg = document.createElementNS(SVGNS, 'svg')
    svg.setAttribute('class', 'layer')
    svg.setAttribute('viewBox', '0 0 1200 640')
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice')
    svg.style.animationDuration = `${24 - d * 4}s`
    for (let i = 0; i < PER_LAYER; i++) {
      const c = document.createElementNS(SVGNS, 'circle')
      c.setAttribute('cx', (i * 137 + d * 61) % 1500)
      c.setAttribute('cy', (i * 89 + d * 43) % 640)
      c.setAttribute('r', 0.6 + d * 0.5)
      c.setAttribute('fill', '#dce8ff')
      c.setAttribute('opacity', 0.25 + d * 0.15)
      svg.appendChild(c)
    }
    stage.appendChild(svg)
  }
</script>
